<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MANNAJA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .flatpickr-calendar.inline { 
            width: 100% !important; min-width: 300px !important; max-width: 100% !important; 
            margin: 0 auto !important; box-shadow: none; border: 1px solid #e5e7eb; 
            border-radius: 1.25rem; padding: 10px; box-sizing: border-box;
        }
        .flatpickr-innerContainer, .flatpickr-rContainer, .flatpickr-days { width: 100% !important; }
        .dayContainer { width: 100% !important; min-width: 100% !important; display: flex !important; flex-wrap: wrap !important; }
        .flatpickr-day { 
            height: 55px !important; line-height: 24px !important; flex: 1 0 14.28% !important; 
            max-width: 14.28% !important; display: flex !important; flex-direction: column !important; 
            align-items: center !important; justify-content: flex-start !important; padding-top: 4px !important;
            position: relative !important; border: none !important; margin: 0 !important;
        }
        .flatpickr-day.selected { background: transparent !important; color: #4f46e5 !important; font-weight: 800 !important; }
        .flatpickr-day.selected::after {
            content: ''; position: absolute; top: 16px; left: 50%; transform: translate(-50%, -50%);
            width: 30px; height: 30px; background-color: rgba(79, 70, 229, 0.1); border-radius: 50%; z-index: -1;
        }
        .dots-container { display: grid !important; grid-template-columns: repeat(3, 1fr) !important; gap: 2px !important; margin-top: 12px !important; }
        .user-dot { width: 5px; height: 5px; border-radius: 50%; display: inline-block; }
        .day-most-voted::before {
            content: ''; position: absolute; top: 16px; left: 50%; transform: translate(-50%, -50%);
            width: 34px; height: 34px; border: 2.5px solid #f59e0b; border-radius: 50%; animation: pulse-gold 2s infinite;
        }
        @keyframes pulse-gold { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 antialiased min-h-screen flex items-center justify-center">

    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl transition-all duration-300 opacity-0 -translate-y-5 pointer-events-none z-[200] text-sm font-medium"></div>

    <!-- 모달: 방 관리 메뉴 (공유, 수정, 나가기, 삭제) -->
    <div id="modal-room-manage" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 space-y-3">
            <h2 class="font-bold text-lg mb-4 text-center">방 관리</h2>
            <button onclick="handleShareRoom()" class="w-full py-4 bg-indigo-50 text-indigo-600 rounded-xl font-bold flex items-center justify-center gap-2">🔗 초대 링크 복사</button>
            <button onclick="openRenameModal()" class="w-full py-4 bg-gray-50 text-gray-700 rounded-xl font-bold">✏️ 방 이름 변경</button>
            <div class="grid grid-cols-2 gap-2 pt-2">
                <button onclick="confirmLeaveRoom()" class="py-4 bg-orange-50 text-orange-600 rounded-xl font-bold text-sm">🚪 방 나가기</button>
                <button onclick="confirmDeleteRoom()" class="py-4 bg-red-50 text-red-600 rounded-xl font-bold text-sm">🗑️ 방 삭제</button>
            </div>
            <button onclick="closeRoomManage()" class="w-full py-3 text-gray-400 text-sm">닫기</button>
        </div>
    </div>

    <!-- 모달: 방 이름 변경 입력 -->
    <div id="modal-rename" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[110] p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <h2 class="font-bold text-lg mb-4">방 이름 변경</h2>
            <input type="text" id="renameInput" class="w-full p-4 bg-gray-50 border rounded-xl outline-none font-bold mb-4">
            <div class="flex gap-2">
                <button onclick="closeRenameModal()" class="flex-1 py-3 bg-gray-100 rounded-xl">취소</button>
                <button onclick="handleRenameRoom()" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold">변경하기</button>
            </div>
        </div>
    </div>

    <!-- 기존 정보 수정/확인 모달 생략 (동일 유지) -->
    <div id="modal-profile" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[100] p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">
            <h2 class="font-bold text-lg mb-4 text-center">내 정보 수정</h2>
            <div class="space-y-4">
                <input type="text" id="editName" placeholder="이름" class="w-full p-3 bg-gray-50 border rounded-xl font-bold outline-none">
                <div id="colorPickerContainer" class="flex flex-wrap gap-2 justify-center"></div>
            </div>
            <div class="flex gap-2 mt-6">
                <button onclick="closeProfileModal()" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold">취소</button>
                <button onclick="handleUpdateProfile()" class="flex-1 py-3 bg-indigo-600 text-white rounded-xl font-bold">저장</button>
            </div>
        </div>
    </div>

    <div id="modal-confirm" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[120] p-4">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 text-center">
            <p id="confirm-message" class="mb-6 font-medium whitespace-pre-line"></p>
            <div class="flex gap-2">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-gray-100 rounded-xl font-bold">취소</button>
                <button id="btn-confirm-action" class="flex-1 py-3 bg-red-500 text-white rounded-xl font-bold">확인</button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 relative overflow-hidden">
        <div id="loading" class="hidden absolute inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50">
            <span class="text-indigo-600 font-semibold animate-pulse tracking-widest">LOADING</span>
        </div>

        <h1 class="text-3xl font-black text-indigo-600 text-center mb-8 tracking-tighter">MANNAJA</h1>

        <div id="screen-auth" class="space-y-4">
            <h2 class="font-bold text-gray-700 text-lg border-b pb-2 text-center">반가워요! 로그인 해주세요.</h2>
            <input type="email" id="authEmail" placeholder="이메일" class="w-full p-4 bg-gray-50 border rounded-xl outline-none">
            <input type="password" id="authPassword" placeholder="비밀번호" class="w-full p-4 bg-gray-50 border rounded-xl outline-none">
            <input type="text" id="authName" placeholder="표시될 이름 (가입 시)" class="w-full p-4 bg-gray-50 border rounded-xl outline-none font-bold">
            <div class="flex gap-2 pt-2">
                <button onclick="handleLogin()" class="flex-1 bg-gray-800 text-white font-bold py-4 rounded-xl shadow-lg">로그인</button>
                <button onclick="handleSignUp()" class="flex-1 bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg">가입하기</button>
            </div>
        </div>

        <div id="screen-dashboard" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-2">
                <div class="flex items-center gap-2">
                    <h2 class="font-bold text-gray-700">나의 모임</h2>
                    <button onclick="openProfileModal()" class="text-[10px] bg-indigo-50 text-indigo-600 px-2 py-1 rounded-full font-bold">내 정보 수정</button>
                </div>
                <button onclick="handleLogout()" class="text-xs text-red-500 underline">로그아웃</button>
            </div>
            <div id="my-rooms-list" class="space-y-3 max-h-64 overflow-y-auto no-scrollbar"></div>
            <div class="space-y-3 pt-4 border-t">
                <div class="flex gap-2">
                    <input type="text" id="newRoomName" placeholder="새 모임 이름" class="flex-1 p-3 bg-gray-50 border rounded-xl outline-none">
                    <button onclick="handleCreateRoom()" class="bg-indigo-600 text-white px-5 font-bold rounded-xl">생성</button>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="joinRoomCode" placeholder="초대 코드" class="flex-1 p-3 bg-gray-50 border rounded-xl outline-none uppercase">
                    <button onclick="handleJoinRoom()" class="bg-gray-800 text-white px-5 font-bold rounded-xl">입장</button>
                </div>
            </div>
        </div>

        <div id="screen-calendar" class="hidden space-y-4">
            <div class="flex justify-between items-start">
                <div>
                    <h2 id="roomTitleDisplay" class="font-black text-2xl text-gray-800 tracking-tight"></h2>
                    <p id="roomCodeDisplay" class="text-xs text-indigo-500 font-bold mt-1 uppercase tracking-wider"></p>
                </div>
                <!-- 1번 수정: 통합 관리 버튼 -->
                <button onclick="openRoomManage()" class="bg-gray-100 text-gray-700 px-3 py-2 rounded-xl border font-bold text-xs">방 관리</button>
            </div>
            
            <div id="legend-container" class="flex flex-wrap gap-2 text-[10px] pb-2"></div>
            <div id="calendar-container" class="w-full overflow-hidden"><input type="text" id="calendar" class="hidden"></div>
            
            <div id="date-voters-panel" class="bg-indigo-50 rounded-2xl p-4 text-center min-h-[70px] flex flex-col items-center justify-center">
                <p id="selected-date-text" class="text-xs font-bold text-indigo-400 mb-2 italic">날짜를 선택해 보세요!</p>
                <div id="voters-list" class="flex flex-wrap gap-2 justify-center w-full"></div>
            </div>

            <div id="view-mode-buttons" class="flex gap-2">
                <button onclick="exitToDashboard()" class="flex-1 bg-gray-100 py-4 rounded-2xl font-bold text-gray-500">목록으로</button>
                <button onclick="toggleEditMode(true)" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg">일정 등록/수정</button>
            </div>
            <div id="edit-mode-buttons" class="hidden flex gap-2">
                <button onclick="toggleEditMode(false)" class="flex-1 bg-gray-100 py-4 rounded-2xl font-bold text-gray-500">취소</button>
                <button onclick="submitDates()" class="flex-[2] bg-indigo-600 text-white py-4 rounded-2xl font-bold shadow-lg">저장하기</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cqorkfocgpisqgsjxxbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_SNOSyYx-qg5RNgqkrUVRsQ_Ps9ShpTP';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        
        // 페이지 로드 시 실행되는 자동 로그인 체크 로직
        window.onload = async () => {
            showLoading(true);
            
            // 1. 브라우저에 저장된 기존 로그인 세션이 있는지 확인
            const { data: { session }, error } = await supabaseClient.auth.getSession();
            
            if (session && !error) {
                // 세션이 있다면 사용자 정보를 상태에 저장하고 즉시 대시보드로 이동
                state.user = session.user;
                showToast(`${state.user.user_metadata.display_name}님, 다시 오신 것을 환영합니다!`);
                await loadMyRooms();
                switchScreen('screen-dashboard');
            } else {
                // 세션이 없다면 로그인 화면 유지
                switchScreen('screen-auth');
            }
            
            showLoading(false);
        };

        
        const FIXED_PALETTE = ["#EF4444", "#F97316", "#F59E0B", "#10B981", "#14B8A6", "#3B82F6", "#6366F1", "#8B5CF6", "#EC4899", "#64748B"];
        const state = { user: null, roomCode: null, roomName: null, roomData: {}, orderedUsers: [], userColors: {}, mostVotedDates: [], isEditMode: false };
        let fpInstance = null;
        let currentEditColor = "";


        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.classList.remove('opacity-0', '-translate-y-5');
            setTimeout(() => toast.classList.add('opacity-0', '-translate-y-5'), 2500);
        }
        function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
        function switchScreen(id) {
            ['screen-auth', 'screen-dashboard', 'screen-calendar'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // --- 방 관리 로직 (1번) ---
        function openRoomManage() { document.getElementById('modal-room-manage').classList.remove('hidden'); }
        function closeRoomManage() { document.getElementById('modal-room-manage').classList.add('hidden'); }

        async function handleShareRoom() {
            const shareText = `[MANNAJA] 모임에 초대합니다!\n모임명: ${state.roomName}\n코드: ${state.roomCode}\n접속: ${window.location.href}`;
            try {
                if (navigator.share) {
                    await navigator.share({ title: 'MANNAJA 초대', text: shareText, url: window.location.href });
                } else {
                    await navigator.clipboard.writeText(shareText);
                    showToast("초대 링크가 복사되었습니다!");
                }
            } catch (err) { console.log(err); }
            closeRoomManage();
        }

        function openRenameModal() { 
            closeRoomManage();
            document.getElementById('renameInput').value = state.roomName;
            document.getElementById('modal-rename').classList.remove('hidden'); 
        }
        function closeRenameModal() { document.getElementById('modal-rename').classList.add('hidden'); }

        async function handleRenameRoom() {
            const newName = document.getElementById('renameInput').value.trim();
            if(!newName || newName === state.roomName) return closeRenameModal();
            
            showLoading(true);
            // 중복 방 이름 체크
            const { data: dup } = await supabaseClient.from('rooms').select('room_name').eq('room_name', newName).maybeSingle();
            if(dup) { showLoading(false); return showToast("이미 사용 중인 방 이름입니다."); }

            const { error } = await supabaseClient.from('rooms').update({ room_name: newName }).eq('room_code', state.roomCode);
            showLoading(false);
            if(error) return showToast("변경 권한이 없습니다.");
            
            state.roomName = newName;
            document.getElementById('roomTitleDisplay').innerText = newName;
            showToast("방 이름이 변경되었습니다.");
            closeRenameModal();
            loadMyRooms();
        }

        // --- 데이터 로드 로직 (2번: 다중 최다 득표 강조 반영) ---
        async function loadCalendarData() {
            showLoading(true);
            const { data: votes } = await supabaseClient.from('dates').select('user_name, user_color, available_date').eq('room_code', state.roomCode);
            showLoading(false);
            
            state.roomData = {}; state.orderedUsers = []; state.userColors = {};
            let voteCounts = {}; let maxVotes = 0; state.mostVotedDates = [];

            votes.forEach(v => {
                if(!state.roomData[v.available_date]) state.roomData[v.available_date] = [];
                state.roomData[v.available_date].push(v.user_name);
                if(!state.orderedUsers.includes(v.user_name)) state.orderedUsers.push(v.user_name);
                state.userColors[v.user_name] = v.user_color;

                voteCounts[v.available_date] = (voteCounts[v.available_date] || 0) + 1;
                if(voteCounts[v.available_date] > maxVotes) maxVotes = voteCounts[v.available_date];
            });

            // 2번: 공동 1위 모두 추출
            if(maxVotes > 0) {
                state.mostVotedDates = Object.keys(voteCounts).filter(d => voteCounts[d] === maxVotes);
            }
            
            renderCalendar(); 
            switchScreen('screen-calendar');
        }

        // --- 달력 렌더링 (동일 로직 유지하되 state.mostVotedDates 연동) ---
        function renderCalendar() {
            const myName = state.user.user_metadata.display_name;
            const myColor = state.user.user_metadata.color || FIXED_PALETTE[0];
            const usersSet = new Set(state.orderedUsers); usersSet.add(myName);
            state.userColors[myName] = myColor;

            document.getElementById('legend-container').innerHTML = Array.from(usersSet).map(u => 
                `<span class="flex items-center gap-1 bg-white border px-2 py-0.5 rounded-full font-bold shadow-sm">
                    <span class="user-dot" style="background-color: ${state.userColors[u] || '#ccc'}"></span>${u}
                </span>`).join('');

            const myDates = Object.keys(state.roomData).filter(d => state.roomData[d].includes(myName));
            if (fpInstance) fpInstance.destroy();
            
            fpInstance = flatpickr("#calendar", {
                inline: true, mode: "multiple", locale: "ko", dateFormat: "Y-m-d", defaultDate: myDates, disableMobile: "true",
                onDayCreate: (dObj, dStr, fp, dayElem) => {
                    const d = flatpickr.formatDate(dayElem.dateObj, "Y-m-d");
                    // 2번: 다중 강조 표시
                    if(state.mostVotedDates.includes(d)) dayElem.classList.add('day-most-voted');

                    const users = state.roomData[d] || [];
                    if (users.length > 0) {
                        const dotsContainer = document.createElement("div"); 
                        dotsContainer.className = "dots-container";
                        users.slice(0, 6).forEach((u, i) => {
                            if (i === 5 && users.length > 6) {
                                dotsContainer.innerHTML += `<span class="text-[8px] font-bold text-gray-400">+</span>`;
                            } else if (i < 6) {
                                dotsContainer.innerHTML += `<span class="user-dot" style="background-color: ${state.userColors[u] || '#ccc'}"></span>`;
                            }
                        });
                        dayElem.appendChild(dotsContainer);
                    }

                    dayElem.addEventListener('click', (e) => {
                        if(state.isEditMode) return;
                        e.stopPropagation();
                        const dateUsers = state.roomData[d] || [];
                        document.getElementById('selected-date-text').innerText = `${d} 투표 참여자 (${dateUsers.length}명)`;
                        document.getElementById('voters-list').innerHTML = dateUsers.map(u => `
                            <span class="px-2 py-1 bg-white rounded-lg border text-[10px] font-bold flex items-center gap-1 shadow-sm">
                                <span class="w-2 h-2 rounded-full" style="background-color: ${state.userColors[u]}"></span>${u}
                            </span>
                        `).join('') || "<p class='text-[10px] text-gray-400'>아직 투표가 없어요!</p>";
                    });
                }
            });
            if(!state.isEditMode) fpInstance.set('clickOpens', false);
        }

        // --- 기타 공통 함수 (이전 코드와 동일 - 생략 금지) ---
        function toggleEditMode(isEdit) {
            state.isEditMode = isEdit;
            document.getElementById('view-mode-buttons').classList.toggle('hidden', isEdit);
            document.getElementById('edit-mode-buttons').classList.toggle('hidden', !isEdit);
            if(isEdit) { document.getElementById('selected-date-text').innerText = "일정 등록 모드입니다."; document.getElementById('voters-list').innerHTML = ""; }
            else { loadCalendarData(); }
            renderCalendar();
        }
        async function handleLogin() {
            const e = document.getElementById('authEmail').value; const p = document.getElementById('authPassword').value;
            showLoading(true); const { data, error } = await supabaseClient.auth.signInWithPassword({ email: e, password: p });
            showLoading(false); if(error) return showToast("로그인 정보를 확인해주세요.");
            state.user = data.user; await loadMyRooms(); switchScreen('screen-dashboard');
        }
        async function handleSignUp() {
            const e = document.getElementById('authEmail').value; const p = document.getElementById('authPassword').value; const n = document.getElementById('authName').value;
            if(!n) return showToast("이름을 입력하세요.");
            showLoading(true); const { data, error } = await supabaseClient.auth.signUp({ email: e, password: p, options: { data: { display_name: n, color: FIXED_PALETTE[0] } } });
            showLoading(false); if(error) return showToast(error.message);
            state.user = data.user; await loadMyRooms(); switchScreen('screen-dashboard');
        }
        async function loadMyRooms() {
            const { data } = await supabaseClient.from('room_participants').select(`room_code, rooms ( room_name )`).eq('user_id', state.user.id);
            const list = document.getElementById('my-rooms-list');
            list.innerHTML = data?.map(i => `<div onclick="enterRoom('${i.room_code}', '${i.rooms.room_name}')" class="p-4 border rounded-2xl flex justify-between items-center bg-white shadow-sm cursor-pointer hover:border-indigo-500 transition-all">
                <div><h3 class="font-bold text-gray-800">${i.rooms.room_name}</h3><p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">${i.room_code}</p></div><span class="text-indigo-600 font-black">➔</span></div>`).join('') || "<p class='text-center text-xs text-gray-400 py-10'>참여 중인 모임이 없습니다.</p>";
        }
        function enterRoom(c, n) { state.roomCode = c; state.roomName = n; document.getElementById('roomTitleDisplay').innerText = n; document.getElementById('roomCodeDisplay').innerText = "CODE: "+c; loadCalendarData(); }
        async function handleCreateRoom() {
            const n = document.getElementById('newRoomName').value; if(!n) return;
            showLoading(true);
            const { data: dup } = await supabaseClient.from('rooms').select('room_name').eq('room_name', n).maybeSingle();
            if(dup) { showLoading(false); return showToast("중복된 방 이름입니다."); }
            const c = Math.random().toString(36).substring(2, 8).toUpperCase();
            await supabaseClient.from('rooms').insert([{ room_code: c, room_name: n }]);
            await supabaseClient.from('room_participants').insert([{ room_code: c, user_id: state.user.id }]);
            showLoading(false); document.getElementById('newRoomName').value = ""; await loadMyRooms(); enterRoom(c, n);
        }
        async function handleJoinRoom() {
            const c = document.getElementById('joinRoomCode').value.toUpperCase();
            const { data } = await supabaseClient.from('rooms').select('room_name').eq('room_code', c).single();
            if(!data) return showToast("방이 존재하지 않습니다.");
            await supabaseClient.from('room_participants').upsert([{ room_code: c, user_id: state.user.id }]);
            document.getElementById('joinRoomCode').value = ""; await loadMyRooms(); enterRoom(c, data.room_name);
        }
        async function submitDates() {
            const dates = fpInstance.selectedDates.map(d => flatpickr.formatDate(d, "Y-m-d"));
            const n = state.user.user_metadata.display_name; const c = state.user.user_metadata.color;
            showLoading(true);
            await supabaseClient.from('dates').delete().eq('room_code', state.roomCode).eq('user_id', state.user.id);
            if(dates.length > 0) await supabaseClient.from('dates').insert(dates.map(d => ({ room_code: state.roomCode, user_id: state.user.id, user_name: n, user_color: c, available_date: d })));
            showLoading(false); showToast("일정이 성공적으로 저장되었습니다!"); toggleEditMode(false);
        }
        function exitToDashboard() { loadMyRooms(); switchScreen('screen-dashboard'); }
        async function handleLogout() { await supabaseClient.auth.signOut(); switchScreen('screen-auth'); }
        function openProfileModal() { document.getElementById('editName').value = state.user.user_metadata.display_name || ""; currentEditColor = state.user.user_metadata.color || FIXED_PALETTE[0]; renderColorPicker(); document.getElementById('modal-profile').classList.remove('hidden'); }
        function closeProfileModal() { document.getElementById('modal-profile').classList.add('hidden'); }
        async function handleUpdateProfile() { const n = document.getElementById('editName').value.trim(); if(!n) return; showLoading(true); const { data, error } = await supabaseClient.auth.updateUser({ data: { display_name: n, color: currentEditColor } }); if (!error) { await supabaseClient.from('dates').update({ user_name: n, user_color: currentEditColor }).eq('user_id', state.user.id); state.user = data.user; closeProfileModal(); await loadMyRooms(); } showLoading(false); }
        function renderColorPicker() { const c = document.getElementById('colorPickerContainer'); c.innerHTML = FIXED_PALETTE.map(cl => `<button onclick="currentEditColor='${cl}'; renderColorPicker();" class="w-7 h-7 rounded-full transition-all ${currentEditColor === cl ? 'ring-4 ring-offset-2 ring-indigo-400 scale-110' : 'hover:scale-110'}" style="background-color: ${cl};"></button>`).join(''); }
        function confirmLeaveRoom() { closeRoomManage(); openConfirmModal("방에서 나가시겠습니까?\n작성한 데이터가 삭제됩니다.", async () => { await supabaseClient.from('dates').delete().eq('room_code', state.roomCode).eq('user_id', state.user.id); await supabaseClient.from('room_participants').delete().eq('room_code', state.roomCode).eq('user_id', state.user.id); exitToDashboard(); }); }
        function confirmDeleteRoom() { closeRoomManage(); openConfirmModal("방을 영구 삭제하시겠습니까?\n모든 참여자의 데이터가 사라집니다.", async () => { await supabaseClient.from('rooms').delete().eq('room_code', state.roomCode); exitToDashboard(); }); }
        function closeConfirmModal() { document.getElementById('modal-confirm').classList.add('hidden'); }
        function openConfirmModal(msg, action) { document.getElementById('confirm-message').innerText = msg; const btn = document.getElementById('btn-confirm-action'); const nBtn = btn.cloneNode(true); btn.parentNode.replaceChild(nBtn, btn); nBtn.onclick = () => { closeConfirmModal(); action(); }; document.getElementById('modal-confirm').classList.remove('hidden'); }
    </script>
</body>
</html>
