<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MANNAJA Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .flatpickr-calendar.inline { width: 100%; box-shadow: none; border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 10px; }
        .flatpickr-day { height: 45px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 5px; position: relative; border-radius: 0.5rem !important; }
        
        /* 4번 수정: 내가 선택한 일자 강조 (숫자 뒤에 동그라미) */
        .flatpickr-day.selected { background: transparent !important; border: none !important; color: #374151 !important; }
        .flatpickr-day.selected::before { content: ''; position: absolute; top: 4px; width: 28px; height: 28px; background: rgba(79, 70, 229, 0.15); border: 2px solid #4f46e5; border-radius: 50%; z-index: -1; }

        /* 3번 추가: 최다 투표 일자 강조 (테두리 반짝임) */
        .day-most-voted { box-shadow: inset 0 0 0 2px #f59e0b !important; background-color: #fffbeb !important; animation: pulse-gold 2s infinite; }
        @keyframes pulse-gold { 0% { box-shadow: inset 0 0 0 2px #f59e0b; } 50% { box-shadow: inset 0 0 0 4px #fbbf24; } 100% { box-shadow: inset 0 0 0 2px #f59e0b; } }

        .dots-container { display: flex; gap: 2px; margin-top: 18px; justify-content: center; width: 100%; flex-wrap: wrap; padding: 0 2px; position: absolute; }
        .user-dot { width: 5px; height: 5px; border-radius: 50%; }
        .spin { animation: spin 0.6s linear; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 antialiased min-h-screen flex items-center justify-center">

    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl transition-all duration-300 opacity-0 -translate-y-5 pointer-events-none z-[100] text-sm font-medium whitespace-nowrap"></div>

    <!-- 확인 모달 (나가기/삭제용) -->
    <div id="modal-confirm" class="hidden fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-[110] p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-sm p-6 text-center">
            <p id="confirm-message" class="text-gray-800 font-medium mb-6 whitespace-pre-line"></p>
            <div class="flex gap-2">
                <button onclick="closeConfirmModal()" class="flex-1 py-3 bg-gray-100 rounded-lg font-bold">취소</button>
                <button id="btn-confirm-action" class="flex-1 py-3 bg-red-500 text-white rounded-lg font-bold">확인</button>
            </div>
        </div>
    </div>

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 relative overflow-hidden">
        <div id="loading" class="hidden absolute inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50">
            <span class="text-indigo-600 font-semibold animate-pulse">처리 중...</span>
        </div>

        <h1 class="text-2xl font-extrabold text-indigo-600 text-center mb-8">MANNAJA</h1>

        <!-- 화면 1: 로그인 -->
        <div id="screen-auth" class="space-y-4">
            <h2 class="font-bold text-gray-700 text-lg border-b pb-2">로그인</h2>
            <input type="email" id="authEmail" placeholder="이메일" class="w-full p-3 bg-gray-50 border rounded-lg outline-none">
            <input type="password" id="authPassword" placeholder="비밀번호" class="w-full p-3 bg-gray-50 border rounded-lg outline-none">
            <input type="text" id="authName" placeholder="이름 (가입 시)" class="w-full p-3 bg-gray-50 border rounded-lg outline-none font-bold">
            <div class="flex gap-2">
                <button onclick="handleLogin()" class="flex-1 bg-gray-800 text-white font-bold py-3 rounded-lg">로그인</button>
                <button onclick="handleSignUp()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg">가입</button>
            </div>
        </div>

        <!-- 화면 2: 대시보드 -->
        <div id="screen-dashboard" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-bold text-gray-700 text-lg">내 모임</h2>
                <button onclick="handleLogout()" class="text-xs text-red-500 underline">로그아웃</button>
            </div>
            <div id="my-rooms-list" class="space-y-3 max-h-64 overflow-y-auto no-scrollbar"></div>
            <div class="space-y-3 pt-4 border-t">
                <div class="flex gap-2">
                    <input type="text" id="newRoomName" placeholder="새 방 이름" class="flex-1 p-3 bg-gray-50 border rounded-lg outline-none">
                    <button onclick="handleCreateRoom()" class="bg-indigo-600 text-white px-4 font-bold rounded-lg">생성</button>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="joinRoomCode" placeholder="초대 코드" class="flex-1 p-3 bg-gray-50 border rounded-lg outline-none uppercase">
                    <button onclick="handleJoinRoom()" class="bg-gray-800 text-white px-4 font-bold rounded-lg">입장</button>
                </div>
            </div>
        </div>

        <!-- 화면 3: 달력 -->
        <div id="screen-calendar" class="hidden space-y-4">
            <div class="flex justify-between items-start">
                <div>
                    <h2 id="roomTitleDisplay" class="font-bold text-xl"></h2>
                    <p id="roomCodeDisplay" class="text-xs text-indigo-600"></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="confirmLeaveRoom()" class="text-[10px] bg-orange-50 text-orange-600 px-2 py-1 rounded border border-orange-200">방 나가기</button>
                    <button onclick="confirmDeleteRoom()" class="text-[10px] bg-red-50 text-red-600 px-2 py-1 rounded border border-red-200">방 삭제</button>
                </div>
            </div>
            <div id="legend-container" class="flex flex-wrap gap-2 text-[10px]"></div>
            <div id="calendar-container">
                <input type="text" id="calendar" class="hidden">
            </div>
            <div class="flex gap-2">
                <button onclick="exitToDashboard()" class="flex-1 bg-gray-100 py-3 rounded-lg font-bold">목록으로</button>
                <button onclick="submitDates()" class="flex-[2] bg-indigo-600 text-white py-3 rounded-lg font-bold">일정 제출</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://cqorkfocgpisqgsjxxbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_SNOSyYx-qg5RNgqkrUVRsQ_Ps9ShpTP';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        const state = { user: null, roomCode: null, roomName: null, roomData: {}, orderedUsers: [], userColors: {}, mostVotedDate: null };
        let fpInstance = null;

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg; toast.classList.remove('opacity-0', '-translate-y-5');
            setTimeout(() => toast.classList.add('opacity-0', '-translate-y-5'), 2500);
        }
        function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
        function switchScreen(id) {
            ['screen-auth', 'screen-dashboard', 'screen-calendar'].forEach(s => document.getElementById(s).classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
        }

        // 모달 관련
        function openConfirmModal(msg, action) {
            document.getElementById('confirm-message').innerText = msg;
            const btn = document.getElementById('btn-confirm-action');
            const newBtn = btn.cloneNode(true);
            btn.parentNode.replaceChild(newBtn, btn);
            newBtn.onclick = () => { closeConfirmModal(); action(); };
            document.getElementById('modal-confirm').classList.remove('hidden');
        }
        function closeConfirmModal() { document.getElementById('modal-confirm').classList.add('hidden'); }

        // 자동 로그인
        window.onload = async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) { state.user = session.user; await loadMyRooms(); switchScreen('screen-dashboard'); }
        };

        // 1번: 방 나가기
        function confirmLeaveRoom() {
            openConfirmModal("이 방에서 나 가시겠습니까?\n작성한 일정은 모두 삭제됩니다.", handleLeaveRoom);
        }
        async function handleLeaveRoom() {
            showLoading(true);
            await supabaseClient.from('dates').delete().eq('room_code', state.roomCode).eq('user_id', state.user.id);
            await supabaseClient.from('room_participants').delete().eq('room_code', state.roomCode).eq('user_id', state.user.id);
            showLoading(false); showToast("방에서 퇴장했습니다."); exitToDashboard();
        }

        // 2번: 방 삭제
        function confirmDeleteRoom() {
            openConfirmModal("방을 영구 삭제하시겠습니까?\n모든 참여자의 데이터가 삭제됩니다.", handleDeleteRoom);
        }
        async function handleDeleteRoom() {
            showLoading(true);
            const { error } = await supabaseClient.from('rooms').delete().eq('room_code', state.roomCode);
            showLoading(false);
            if(error) return showToast("방 소유자만 삭제할 수 있습니다.");
            showToast("방이 삭제되었습니다."); exitToDashboard();
        }

        async function loadCalendarData() {
            showLoading(true);
            const { data: votes } = await supabaseClient.from('dates').select('user_name, user_color, available_date').eq('room_code', state.roomCode);
            showLoading(false);
            
            state.roomData = {}; state.orderedUsers = []; state.userColors = {};
            let voteCounts = {}; let maxVotes = 0; state.mostVotedDate = null;

            votes.forEach(v => {
                if(!state.roomData[v.available_date]) state.roomData[v.available_date] = [];
                state.roomData[v.available_date].push(v.user_name);
                if(!state.orderedUsers.includes(v.user_name)) state.orderedUsers.push(v.user_name);
                state.userColors[v.user_name] = v.user_color;

                // 3번: 최다 투표 계산
                voteCounts[v.available_date] = (voteCounts[v.available_date] || 0) + 1;
                if(voteCounts[v.available_date] > maxVotes) {
                    maxVotes = voteCounts[v.available_date];
                    state.mostVotedDate = v.available_date;
                }
            });
            renderCalendar(); switchScreen('screen-calendar');
        }

        function renderCalendar() {
            const myName = state.user.user_metadata.display_name;
            const myColor = state.user.user_metadata.color || "#4f46e5";
            const usersSet = new Set(state.orderedUsers); usersSet.add(myName);
            state.userColors[myName] = myColor;

            document.getElementById('legend-container').innerHTML = Array.from(usersSet).map(u => 
                `<span class="flex items-center gap-1 bg-white border px-2 py-0.5 rounded-full font-bold">
                    <span class="user-dot" style="background-color: ${state.userColors[u] || '#ccc'}"></span>${u}
                </span>`).join('');

            const myDates = Object.keys(state.roomData).filter(d => state.roomData[d].includes(myName));
            if (fpInstance) fpInstance.destroy();
            
            fpInstance = flatpickr("#calendar", {
                inline: true, mode: "multiple", locale: "ko", dateFormat: "Y-m-d", defaultDate: myDates,
                onDayCreate: (dObj, dStr, fp, dayElem) => {
                    const d = flatpickr.formatDate(dayElem.dateObj, "Y-m-d");
                    
                    // 3번: 최다 투표 강조
                    if(d === state.mostVotedDate && state.roomData[d]?.length > 0) dayElem.classList.add('day-most-voted');

                    const users = state.roomData[d] || [];
                    if (users.length > 0) {
                        const dots = document.createElement("div"); dots.className = "dots-container";
                        users.forEach(u => {
                            const dot = document.createElement("span"); dot.className = "user-dot";
                            dot.style.backgroundColor = state.userColors[u] || '#ccc';
                            dots.appendChild(dot);
                        });
                        dayElem.appendChild(dots);
                    }
                }
            });
        }

        // 기존 필수 함수들 (로그인, 방생성 등 - 이전 코드 유지)
        async function handleLogin() {
            const e = document.getElementById('authEmail').value; const p = document.getElementById('authPassword').value;
            showLoading(true); const { data, error } = await supabaseClient.auth.signInWithPassword({ email: e, password: p });
            showLoading(false); if(error) return showToast("로그인 실패");
            state.user = data.user; await loadMyRooms(); switchScreen('screen-dashboard');
        }
        async function handleSignUp() {
            const e = document.getElementById('authEmail').value; const p = document.getElementById('authPassword').value; const n = document.getElementById('authName').value;
            showLoading(true); const { data, error } = await supabaseClient.auth.signUp({ email: e, password: p, options: { data: { display_name: n, color: "#4f46e5" } } });
            showLoading(false); if(error) return showToast(error.message);
            state.user = data.user; await loadMyRooms(); switchScreen('screen-dashboard');
        }
        async function loadMyRooms() {
            const { data } = await supabaseClient.from('room_participants').select(`room_code, rooms ( room_name )`).eq('user_id', state.user.id);
            const list = document.getElementById('my-rooms-list');
            list.innerHTML = data?.map(i => `<div onclick="enterRoom('${i.room_code}', '${i.rooms.room_name}')" class="p-4 border rounded-xl flex justify-between items-center bg-white shadow-sm cursor-pointer hover:border-indigo-500">
                <div><h3 class="font-bold text-gray-800">${i.rooms.room_name}</h3><p class="text-[10px] text-gray-400">${i.room_code}</p></div><span class="text-indigo-600">➔</span></div>`).join('') || "";
        }
        function enterRoom(c, n) { state.roomCode = c; state.roomName = n; document.getElementById('roomTitleDisplay').innerText = n; document.getElementById('roomCodeDisplay').innerText = "코드: "+c; loadCalendarData(); }
        async function handleCreateRoom() {
            const n = document.getElementById('newRoomName').value; if(!n) return;
            const c = Math.random().toString(36).substring(2, 8).toUpperCase();
            await supabaseClient.from('rooms').insert([{ room_code: c, room_name: n }]);
            await supabaseClient.from('room_participants').insert([{ room_code: c, user_id: state.user.id }]);
            document.getElementById('newRoomName').value = ""; await loadMyRooms(); enterRoom(c, n);
        }
        async function handleJoinRoom() {
            const c = document.getElementById('joinRoomCode').value.toUpperCase();
            const { data } = await supabaseClient.from('rooms').select('room_name').eq('room_code', c).single();
            if(!data) return showToast("방이 없습니다.");
            await supabaseClient.from('room_participants').upsert([{ room_code: c, user_id: state.user.id }]);
            document.getElementById('joinRoomCode').value = ""; await loadMyRooms(); enterRoom(c, data.room_name);
        }
        async function submitDates() {
            const dates = fpInstance.selectedDates.map(d => flatpickr.formatDate(d, "Y-m-d"));
            const n = state.user.user_metadata.display_name; const c = state.user.user_metadata.color;
            showLoading(true);
            await supabaseClient.from('dates').delete().eq('room_code', state.roomCode).eq('user_id', state.user.id);
            if(dates.length > 0) await supabaseClient.from('dates').insert(dates.map(d => ({ room_code: state.roomCode, user_id: state.user.id, user_name: n, user_color: c, available_date: d })));
            showLoading(false); showToast("저장 완료"); loadCalendarData();
        }
        function exitToDashboard() { loadMyRooms(); switchScreen('screen-dashboard'); }
        async function handleLogout() { await supabaseClient.auth.signOut(); switchScreen('screen-auth'); }
    </script>
</body>
</html>
