<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SyncTime Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://npmcdn.com/flatpickr/dist/l10n/ko.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        .flatpickr-calendar.inline { width: 100%; box-shadow: none; border: 1px solid #e5e7eb; border-radius: 0.75rem; padding: 10px; }
        .flatpickr-day { height: 45px; line-height: 30px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 5px;}
        .dots-container { display: flex; gap: 2px; margin-top: 2px; justify-content: center; width: 100%; flex-wrap: wrap; padding: 0 4px;}
        .user-dot { width: 5px; height: 5px; border-radius: 50%; }
        .spin { animation: spin 0.6s linear; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* 스크롤바 숨기기 (모바일 깔끔하게) */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 text-gray-800 font-sans p-4 antialiased min-h-screen flex items-center justify-center relative">

    <div id="toast" class="fixed top-10 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full shadow-xl transition-all duration-300 opacity-0 -translate-y-5 pointer-events-none z-[100] text-sm font-medium whitespace-nowrap"></div>

    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-6 relative overflow-hidden">
        <div id="loading" class="hidden absolute inset-0 bg-white bg-opacity-90 flex items-center justify-center z-50">
            <span class="text-indigo-600 font-semibold animate-pulse">데이터 통신 중...</span>
        </div>

        <h1 class="text-2xl font-extrabold text-indigo-600 text-center mb-8">SyncTime</h1>

        <div id="screen-auth" class="space-y-4">
            <h2 class="font-bold text-gray-700 text-lg border-b pb-2">로그인 / 회원가입</h2>
            <input type="email" id="authEmail" placeholder="이메일" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg outline-none">
            <input type="password" id="authPassword" placeholder="비밀번호 (6자리 이상)" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg outline-none">
            <input type="text" id="authName" placeholder="표시될 내 이름 (가입시에만 필수)" class="w-full p-3 bg-gray-50 border border-gray-300 rounded-lg outline-none font-bold">
            <div class="flex gap-2 pt-2">
                <button onclick="handleLogin()" class="flex-1 bg-gray-800 text-white font-bold py-3 rounded-lg shadow-md">로그인</button>
                <button onclick="handleSignUp()" class="flex-1 bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-md">새로 가입하기</button>
            </div>
        </div>

        <div id="screen-dashboard" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="font-bold text-gray-700 text-lg">내 작업 공간</h2>
                <button onclick="handleLogout()" class="text-xs text-red-500 underline">로그아웃</button>
            </div>
            
            <div>
                <h3 class="font-semibold text-gray-500 text-sm mb-3">내 모임 목록</h3>
                <div id="my-rooms-list" class="space-y-3 max-h-56 overflow-y-auto no-scrollbar pb-2">
                    </div>
            </div>

            <div class="relative flex items-center py-2">
                <div class="flex-grow border-t border-gray-300"></div>
                <span class="flex-shrink-0 mx-4 text-gray-400 text-xs">새로운 모임</span>
                <div class="flex-grow border-t border-gray-300"></div>
            </div>

            <div class="space-y-3">
                <div class="flex gap-2">
                    <input type="text" id="newRoomName" placeholder="새 방 이름" class="w-2/3 p-3 bg-gray-50 border border-gray-300 rounded-lg outline-none">
                    <button onclick="handleCreateRoom()" class="w-1/3 bg-indigo-600 text-white font-bold py-3 rounded-lg shadow-md">방 만들기</button>
                </div>
                <div class="flex gap-2">
                    <input type="text" id="joinRoomCode" placeholder="초대 코드" class="w-2/3 p-3 bg-gray-50 border border-gray-300 rounded-lg outline-none uppercase">
                    <button onclick="handleJoinRoom()" class="w-1/3 bg-gray-800 text-white font-bold py-3 rounded-lg shadow-md">코드로 입장</button>
                </div>
            </div>
        </div>

        <div id="screen-calendar" class="hidden space-y-5">
            <div class="flex justify-between items-start border-b pb-2">
                <div>
                    <h2 id="roomTitleDisplay" class="font-bold text-xl text-gray-800">모임 이름</h2>
                    <p id="roomCodeDisplay" class="text-xs text-indigo-600 font-semibold mt-1">코드: </p>
                </div>
                <div class="flex gap-3">
                    <button onclick="loadCalendarData()" class="p-2 hover:bg-gray-100 rounded-full" title="새로고침">
                        <svg id="refresh-icon" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                    </button>
                    <button onclick="exitToDashboard()" class="text-xs text-gray-400 underline pt-2">목록으로</button>
                </div>
            </div>

            <div id="legend-container" class="flex flex-wrap gap-2 text-[10px]"></div>
            <div><input type="text" id="calendar" class="hidden"></div>
            <button onclick="submitDates()" class="w-full bg-indigo-600 text-white font-bold py-4 rounded-xl shadow-lg active:scale-95 transition-transform">가능한 날짜 제출하기</button>
        </div>
    </div>

    <script>
        // ★ Supabase 정보 재입력 ★
        const SUPABASE_URL = 'https://cqorkfocgpisqgsjxxbs.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_SNOSyYx-qg5RNgqkrUVRsQ_Ps9ShpTP';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const state = { user: null, roomCode: null, roomName: null, roomData: {}, orderedUsers: [] };
        let fpInstance = null;

        let toastTimeout;
        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-5');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => toast.classList.add('opacity-0', '-translate-y-5'), 2500);
        }
        function showLoading(show) { document.getElementById('loading').style.display = show ? 'flex' : 'none'; }
        function switchScreen(screenId) {
            ['screen-auth', 'screen-dashboard', 'screen-calendar'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(screenId).classList.remove('hidden');
        }

        async function exitToDashboard() {
            await loadMyRooms();
            switchScreen('screen-dashboard');
        }

        // --- 인증 ---
        async function handleSignUp() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            const name = document.getElementById('authName').value.trim();
            if(!email || !password || !name) return showToast("이메일, 비밀번호, 이름을 모두 입력하세요.");

            showLoading(true);
            const { data, error } = await supabaseClient.auth.signUp({
                email: email, password: password,
                options: { data: { display_name: name } } 
            });
            showLoading(false);

            if(error) return showToast(error.message);
            state.user = data.user;
            showToast("가입 완료!");
            await loadMyRooms(); // 리스트 불러오기
            switchScreen('screen-dashboard');
        }

        async function handleLogin() {
            const email = document.getElementById('authEmail').value.trim();
            const password = document.getElementById('authPassword').value;
            if(!email || !password) return showToast("이메일과 비밀번호를 입력하세요.");

            showLoading(true);
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
            showLoading(false);

            if(error) return showToast("로그인 실패: 정보를 확인해주세요.");
            state.user = data.user;
            showToast("로그인 성공!");
            await loadMyRooms(); // 리스트 불러오기
            switchScreen('screen-dashboard');
        }

        async function handleLogout() {
            await supabaseClient.auth.signOut();
            state.user = null;
            switchScreen('screen-auth');
        }

        // --- 내 방 목록 불러오기 (핵심 로직) ---
        async function loadMyRooms() {
            showLoading(true);
            
            // room_participants 테이블에서 내가 가입된 방의 코드와 방 이름을 조인해서 가져옵니다.
            const { data, error } = await supabaseClient
                .from('room_participants')
                .select(`room_code, rooms ( room_name )`)
                .eq('user_id', state.user.id)
                .order('joined_at', { ascending: false });

            showLoading(false);
            const listContainer = document.getElementById('my-rooms-list');

            if (error || !data || data.length === 0) {
                listContainer.innerHTML = `<div class="text-sm text-gray-400 text-center py-6 bg-gray-50 rounded-lg">아직 참여한 모임이 없습니다. <br>아래에서 방을 만들거나 코드로 입장해보세요!</div>`;
                return;
            }

            let html = '';
            data.forEach(item => {
                const rName = item.rooms.room_name;
                const rCode = item.room_code;
                
                // 클릭 시 해당 방으로 즉시 입장하도록 enterRoom 함수 연결
                html += `
                <div onclick="enterRoom('${rCode}', '${rName}')" class="p-4 border border-gray-200 rounded-xl flex justify-between items-center hover:border-indigo-500 hover:shadow-md cursor-pointer transition-all bg-white group">
                    <div>
                        <h3 class="font-bold text-gray-800">${rName}</h3>
                        <p class="text-[10px] text-gray-400 mt-1 uppercase">코드: ${rCode}</p>
                    </div>
                    <span class="text-indigo-200 group-hover:text-indigo-600 transition-colors font-bold text-xl">➔</span>
                </div>`;
            });
            listContainer.innerHTML = html;
        }

        // 리스트 클릭 시 방 입장 처리 함수
        function enterRoom(code, name) {
            state.roomCode = code;
            state.roomName = name;
            document.getElementById('roomTitleDisplay').innerText = name;
            document.getElementById('roomCodeDisplay').innerText = "초대 코드: " + code;
            loadCalendarData();
        }

        // --- 방 생성 및 입장 ---
        async function handleCreateRoom() {
            const name = document.getElementById('newRoomName').value.trim();
            if(!name) return showToast("방 이름을 입력해주세요.");
            
            showLoading(true);

            // 중복 검사
            const { data: existingRoom, error: searchError } = await supabaseClient
                .from('rooms')
                .select('room_name')
                .eq('room_name', name)
                .maybeSingle();

            if (existingRoom) {
                showLoading(false);
                return showToast("이미 존재하는 방 이름입니다.");
            }

            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            
            // 방 생성
            const { error: insertError } = await supabaseClient.from('rooms').insert([{ room_code: code, room_name: name }]);
            
            if(insertError) {
                showLoading(false);
                return showToast("방 생성 중 오류가 발생했습니다.");
            }

            // ★ 방을 만든 사람을 해당 방의 참여자 명단에 자동 추가 ★
            await supabaseClient.from('room_participants').insert([{ room_code: code, user_id: state.user.id }]);
            
            showLoading(false);
            document.getElementById('newRoomName').value = ''; // 인풋창 초기화
            enterRoom(code, name);
        }

        async function handleJoinRoom() {
            const code = document.getElementById('joinRoomCode').value.trim().toUpperCase();
            if(!code) return showToast("초대 코드를 입력해주세요.");

            showLoading(true);
            
            // 방 존재 여부 확인
            const { data, error } = await supabaseClient.from('rooms').select('room_name').eq('room_code', code).single();
            if(error || !data) {
                showLoading(false);
                return showToast("존재하지 않는 방입니다.");
            }

            // ★ 입력한 방 코드로 나를 참여자 명단에 추가 (이미 가입된 상태여도 에러 없이 처리됨) ★
            await supabaseClient.from('room_participants').upsert([{ room_code: code, user_id: state.user.id }]);
            
            showLoading(false);
            document.getElementById('joinRoomCode').value = ''; // 인풋창 초기화
            enterRoom(code, data.room_name);
        }

        // --- 일정 데이터 (이하 기존과 동일) ---
        async function loadCalendarData() {
            showLoading(true);
            const refreshIcon = document.getElementById('refresh-icon');
            if(refreshIcon) refreshIcon.classList.add('spin');
            
            const { data: votes, error } = await supabaseClient.from('dates').select('user_name, available_date').eq('room_code', state.roomCode).order('id', { ascending: true });
            
            if(refreshIcon) refreshIcon.classList.remove('spin');
            showLoading(false);
            if(error) return showToast("데이터를 불러오는데 실패했습니다.");

            state.roomData = {};
            state.orderedUsers = [];

            votes.forEach(vote => {
                if(!state.roomData[vote.available_date]) state.roomData[vote.available_date] = [];
                state.roomData[vote.available_date].push(vote.user_name);
                if(!state.orderedUsers.includes(vote.user_name)) state.orderedUsers.push(vote.user_name);
            });

            renderCalendar();
            switchScreen('screen-calendar');
        }

        function getUserColor(name) {
            let index = state.orderedUsers.indexOf(name);
            if (index === -1) {
                index = state.orderedUsers.length;
                state.orderedUsers.push(name); 
            }
            const hue = (index * 150) % 360; 
            return `hsl(${hue}, 80%, 50%)`;
        }

        function renderCalendar() {
            const myName = state.user.user_metadata.display_name;
            const usersSet = new Set(state.orderedUsers); 
            usersSet.add(myName); 

            const legendHtml = Array.from(usersSet).map(user => 
                `<span class="flex items-center gap-1 bg-gray-50 border border-gray-200 px-2 py-0.5 rounded-full text-gray-700 font-semibold">
                    <span class="user-dot" style="background-color: ${getUserColor(user)}"></span>${user}
                </span>`
            ).join('');
            document.getElementById('legend-container').innerHTML = legendHtml;

            const myPrevDates = Object.keys(state.roomData).filter(date => state.roomData[date].includes(myName));

            if (fpInstance) fpInstance.destroy(); 
            fpInstance = flatpickr("#calendar", {
                inline: true, mode: "multiple", locale: "ko", dateFormat: "Y-m-d", 
                defaultDate: myPrevDates,
                onDayCreate: function(dObj, dStr, fp, dayElem) {
                    const dateStr = flatpickr.formatDate(dayElem.dateObj, "Y-m-d");
                    const users = state.roomData[dateStr] || [];
                    if (users.length > 0) {
                        const dotsDiv = document.createElement("div");
                        dotsDiv.className = "dots-container";
                        users.forEach(user => {
                            const dot = document.createElement("span");
                            dot.className = "user-dot";
                            dot.style.backgroundColor = getUserColor(user);
                            dotsDiv.appendChild(dot);
                        });
                        dayElem.appendChild(dotsDiv);
                    }
                }
            });
        }

        async function submitDates() {
            const selectedDates = fpInstance.selectedDates.map(date => flatpickr.formatDate(date, "Y-m-d"));
            const myName = state.user.user_metadata.display_name;
            
            showLoading(true);

            await supabaseClient.from('dates').delete().eq('room_code', state.roomCode).eq('user_id', state.user.id);

            if (selectedDates.length > 0) {
                const insertData = selectedDates.map(dateStr => ({
                    room_code: state.roomCode,
                    user_id: state.user.id,
                    user_name: myName,
                    available_date: dateStr
                }));
                const { error } = await supabaseClient.from('dates').insert(insertData);
                if(error) {
                    showLoading(false);
                    return showToast("저장 중 오류가 발생했습니다.");
                }
            }

            showLoading(false);
            showToast("일정이 저장되었습니다!");
            loadCalendarData(); 
        }
    </script>
</body>
</html>
